<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">从草稿到发布的写作流程插画</title><desc id="desc">三个卡片依次写着写下想法、整理结构、发布分享，配色为暖白、深绿和陶土橘</desc><rect width="1200" height="680" rx="28" fill="#e8ece3"/><circle cx="1050" cy="80" r="250" fill="#f8f7f0" opacity=".6"/><circle cx="125" cy="625" r="235" fill="#cad6c7"/><text x="76" y="106" fill="#315146" font-family="sans-serif" font-weight="700" font-size="24" letter-spacing="5">NOTES / 001</text><text x="76" y="170" fill="#20372f" font-family="sans-serif" font-weight="700" font-size="53">把想法写成一篇文章</text><path d="M125 365h950" stroke="#a7b5a6" stroke-width="4" stroke-dasharray="8 12"/><g font-family="sans-serif"><rect x="80" y="260" width="315" height="240" rx="18" fill="#fffdf8"/><rect x="443" y="260" width="315" height="240" rx="18" fill="#fffdf8"/><rect x="806" y="260" width="315" height="240" rx="18" fill="#fffdf8"/><text x="110" y="321" font-size="27" font-weight="700" fill="#ce603e">01</text><text x="473" y="321" font-size="27" font-weight="700" fill="#ce603e">02</text><text x="836" y="321" font-size="27" font-weight="700" fill="#ce603e">03</text><text x="110" y="398" font-size="30" font-weight="700" fill="#20372f">写下想法</text><text x="473" y="398" font-size="30" font-weight="700" fill="#20372f">整理结构</text><text x="836" y="398" font-size="30" font-weight="700" fill="#20372f">发布分享</text><text x="110" y="448" font-size="20" fill="#64746a">先记下来，允许不完整</text><text x="473" y="448" font-size="20" fill="#64746a">标题、图片和重点</text><text x="836" y="448" font-size="20" fill="#64746a">在博客里慢慢积累</text></g><text x="77" y="603" fill="#52695a" font-family="sans-serif" font-size="23" letter-spacing="3">KEEP CURIOUS · ITFETTER</text></svg>