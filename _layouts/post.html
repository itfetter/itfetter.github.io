<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | escape }}">
  <title>{{ page.title | escape }} — itfetter</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{background:#f5f3ee;color:#242722;font:16px/1.95 system-ui,"Noto Sans SC",sans-serif;margin:0}header,main,footer{max-width:820px;padding:0 24px;margin:auto}header{padding-top:36px}header a,footer a{color:#1f332d;text-decoration:none}main{padding-top:64px;padding-bottom:88px}h1{font-size:clamp(32px,5vw,52px);line-height:1.3;letter-spacing:-.04em;margin:16px 0}h2{font-size:26px;margin-top:42px}p,li{color:#3f4640}a{color:#ce603e}a:hover{text-decoration:underline}.meta{color:#ce603e;font-size:13px}.summary{color:#777b75}article{border-top:1px solid #deded6;padding-top:25px;margin-top:30px}blockquote{margin:28px 0;padding:12px 18px;border-left:3px solid #ce603e;background:#eeeee6}footer{border-top:1px solid #deded6;padding-top:24px;padding-bottom:48px;color:#777b75;font-size:13px}

    /* 图文文章排版 */
    .article-body img,article img{display:block;max-width:100%;height:auto;margin:28px auto 10px;border-radius:14px;border:1px solid #deded6;box-shadow:0 18px 46px rgba(31,51,45,.08)}
    .article-body p:has(> img)+p>em,article p:has(> img)+p>em{display:block;text-align:center;color:#777b75;font-size:13px;font-style:normal;line-height:1.7;margin:0 0 34px}
    .article-body h3,article h3{font-size:20px;color:#242722;margin:30px 0 12px}.article-body strong,article strong{color:#1f332d}.article-body .text-accent,article .text-accent{color:#b64e32;font-weight:700}
    .article-body .callout,article .callout{padding:18px 22px;margin:25px 0;background:#e9eee7;border:1px solid #d0dccf;border-left:4px solid #315146;border-radius:9px;color:#294238;line-height:1.8}
    .article-body blockquote,article blockquote{margin:25px 0;padding:16px 22px;background:#f0eee7;border-left:4px solid #ce603e;border-radius:0 8px 8px 0}
    .article-body pre,article pre{max-width:100%;overflow-x:auto;padding:18px 20px;background:#1f332d;color:#f5f3ee;border-radius:10px;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace}
    .article-body pre code,article pre code{background:none;color:inherit;padding:0;white-space:pre;font:inherit}.article-body table,article table{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:25px 0 34px;font-size:14px;line-height:1.6}
    .article-body th,.article-body td,article th,article td{padding:12px 15px;border-bottom:1px solid #deded6;text-align:left;min-width:105px}.article-body th,article th{background:#e8ece3;color:#1f332d}.article-body hr,article hr{border:0;border-top:1px solid #deded6;margin:38px 0}
    @media(max-width:620px){.article-body pre,article pre{font-size:12px}.article-body th,.article-body td,article th,article td{padding:10px 12px}}
  </style>
</head>
<body>
  <header><a href="/">← 返回博客首页</a></header>
  <main>
    <div class="meta">{{ page.category | escape }} · {{ page.date | date: "%Y.%m" }}</div>
    <h1>{{ page.title | escape }}</h1>
    <p class="summary">{{ page.summary | escape }}</p>
    <article>{{ content }}</article>
  </main>
  <footer>© {{ site.time | date: "%Y" }} itfetter · GitHub Pages</footer>
</body>
</html>
