<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>文章管理 · itfetter</title>
<style>
:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#242722;--muted:#68736d;--green:#1f332d;--accent:#c65e3f;--line:#d8ddd5}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Noto Sans SC",sans-serif}button,input,textarea{font:inherit}a{color:var(--accent)}
header{max-width:1300px;margin:auto;padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;color:var(--green);text-decoration:none}.brand span{color:var(--accent)}
main{max-width:1300px;margin:auto;padding:36px 26px 90px}h1{font-size:clamp(30px,4vw,44px);margin:0 0 4px}h2{font-size:20px;margin:0 0 16px}.sub,.muted,small{color:var(--muted)}.sub{margin:0 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;margin:0 0 22px}.hidden{display:none!important}
button,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:white;color:var(--green);font-weight:650;cursor:pointer;text-decoration:none}button:hover,.button:hover{border-color:var(--green)}button.primary,.button.primary{background:var(--green);border-color:var(--green);color:white}button.danger{color:#a1392a;border-color:#dbb9ad}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.sidebar{align-self:start}.post-list{max-height:65vh;overflow:auto}.post-item{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:13px 0;font-weight:650}.post-item small{display:block;font-weight:400}.post-item.active{color:var(--accent)}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px}.fields label,.editor label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.fields .summary{grid-column:1/-1}
input,textarea{display:block;width:100%;padding:10px 12px;border:1px solid #c8d0c6;background:#fff;border-radius:7px;color:var(--ink)}input:focus,textarea:focus{outline:2px solid #95b4a0}input:disabled{background:#ecefe9;color:#747b75}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.toolbar button{padding:5px 9px;font-size:12px}textarea{min-height:430px;resize:vertical;font:14px/1.7 ui-monospace,Consolas,monospace}.preview{min-height:430px;padding:18px;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:auto;overflow-wrap:anywhere}.preview img{max-width:100%;height:auto}.preview pre{overflow:auto;background:var(--green);color:white;padding:12px}.preview blockquote{border-left:3px solid var(--accent);padding-left:12px}.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--line);padding:5px}
#notice{min-height:25px;font-weight:650;color:#315146}#notice.error{color:#a1392a}.legacy{font-size:13px;margin-top:18px}
@media(max-width:900px){.layout,.editor{grid-template-columns:1fr}.post-list{max-height:280px}.fields{grid-template-columns:1fr 1fr}.fields label:first-child{grid-column:1/-1}}@media(max-width:520px){main,header{padding-left:16px;padding-right:16px}.card{padding:17px}.fields{grid-template-columns:1fr}.fields label:first-child,.fields .summary{grid-column:auto}}
</style></head>
<body>
<header><a class="brand" href="/">itfetter<span>.</span></a><a href="/">← 返回博客</a></header>
<main><h1>文章管理</h1><p class="sub">登录管理员账号后，可在这里写作、发布和管理文章。</p>
<section id="login" class="card hidden"><h2>管理员登录</h2><p>输入管理员账号和密码。</p><form id="login-form"><label for="username">账号</label><input id="username" autocomplete="username" maxlength="100" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button id="login-submit" class="primary" style="margin-top:16px">登录</button></form><p id="login-notice" role="status"></p></section>
<div id="dashboard" class="layout hidden">
  <aside class="card sidebar"><div class="row spread"><h2>文章</h2><button id="new" class="primary">＋ 新建</button></div><div id="post-list" class="post-list">加载中…</div><p class="legacy"><button id="password-toggle" type="button" aria-expanded="false" aria-controls="password-panel">修改密码</button></p><section id="password-panel" class="hidden"><h2>修改密码</h2><p>修改后所有设备须重新登录，请先保存文章。</p><form id="password-form"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" maxlength="128" required><label for="new-password">新密码（14–128 字符）</label><input id="new-password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><button id="password-submit" class="primary" style="margin-top:12px">确认修改</button></form><p id="password-notice" role="status"></p></section><p class="legacy"><button id="logout">退出登录</button></p></aside>
  <section class="card"><div class="row spread"><h2 id="mode">新文章</h2><span class="muted" id="file-path"></span></div>
    <div class="fields">
      <label>标题 *<input id="title" maxlength="160" placeholder="文章标题"></label>
      <label>分类 *<input id="category" maxlength="80" value="随笔"></label>
      <label>网址短名 *<input id="slug" placeholder="my-new-post" maxlength="70"></label>
      <label class="summary">摘要 *<input id="summary" maxlength="300" placeholder="用一句话介绍文章"></label>
    </div>
    <div class="editor"><div><label for="body">Markdown 正文</label><div class="toolbar"><button data-insert="heading">小标题</button><button data-insert="bold">加粗</button><button data-insert="link">链接</button><button data-insert="list">列表</button><button data-insert="quote">引用</button><button data-insert="code">代码</button><button id="image">上传图片</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></div><textarea id="body" spellcheck="false" placeholder="从这里开始写…"></textarea></div><div><label>即时预览</label><div id="preview" class="preview"></div></div></div>
    <div class="row" style="margin-top:18px"><button id="save" class="primary">保存并发布</button><button id="delete" class="danger hidden">删除文章</button><a id="view" class="hidden" target="_blank" rel="noopener noreferrer">查看文章 ↗</a></div><p id="notice" role="status"></p>
    <p class="muted">保存后立即发布。已发布文章的短名和链接固定；删除会移除数据库中的文章，删除前请做好备份。</p>
  </section>
</div></main>

<script>
(() => {"use strict";
const root="";
const $=id=>document.getElementById(id), ids=["title","category","slug","summary","body"];
let current=null, listing=[], dirty=false;
const fields=Object.fromEntries(ids.map(id=>[id,$(id)]));
function message(value,error=false){$("notice").textContent=value;$("notice").classList.toggle("error",error)}
function clear(){current=null;for(const id of ids)fields[id].value="";fields.category.value="随笔";fields.slug.disabled=false;$("mode").textContent="新文章";$("file-path").textContent="";$("delete").classList.add("hidden");$("view").classList.add("hidden");dirty=false;preview();renderList();message("")}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inline(s){return escapeHtml(s).replace(/!\[([^\]]*)\]\((https:\/\/[^)]+|\/[^)]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\((https:\/\/[^)]+|\/[^)]+)\)/g,'<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function preview(){let lines=fields.body.value.split(/\r?\n/),output=[],code=false;for(const line of lines){if(line.startsWith("```")){output.push(code?"</code></pre>":"<pre><code>");code=!code;continue}if(code){output.push(escapeHtml(line)+"\n");continue}let m=/^(#{1,3})\s+(.+)$/.exec(line);if(m){output.push("<h"+(m[1].length+1)+">"+inline(m[2])+"</h"+(m[1].length+1)+">");continue}if(/^[-*]\s+/.test(line)){output.push("<p>• "+inline(line.slice(2))+"</p>");continue}if(/^>\s?/.test(line)){output.push("<blockquote>"+inline(line.replace(/^>\s?/,""))+"</blockquote>");continue}output.push(line.trim()?"<p>"+inline(line)+"</p>":"<br>")}$("preview").innerHTML=output.join("")||'<p class="muted">正文预览显示在这里。</p>'}
async function api(path,options={}){const r=await fetch(root+path,{...options,credentials:"same-origin",redirect:"error",headers:{...(options.body?{"content-type":"application/json"}:{}),...options.headers}});let data;try{data=await r.json()}catch{throw Error("登录可能已过期，请重新登录。")}if(!r.ok){if(r.status===401){$("dashboard").classList.add("hidden");$("login").classList.remove("hidden")}throw Error(data.error||"请求失败。")}return data}
function renderList(){const target=$("post-list");target.replaceChildren();if(!listing.length){target.textContent="还没有文章。";return}for(const item of listing){const button=document.createElement("button");button.className="post-item"+(current?.id===item.id?" active":"");button.textContent=item.title;const small=document.createElement("small");small.textContent=item.category+" · "+item.published_at.slice(0,10);button.append(small);button.onclick=()=>openPost(item.id);target.append(button)}}
function discard(){return !dirty||confirm("当前修改尚未保存，确定离开吗？")}
async function openPost(id){if(!discard())return;message("正在读取文章…");try{const article=await api("/api/post?id="+encodeURIComponent(id));current={id,version:article.version};for(const id of ["title","category","summary","body"])fields[id].value=article[id]||"";fields.slug.value=article.id||"";fields.slug.disabled=true;$("mode").textContent="编辑文章";$("file-path").textContent=id;$("delete").classList.remove("hidden");$("view").href="/articles/"+article.id+"/";$("view").classList.remove("hidden");dirty=false;preview();renderList();message("")}catch(e){message(e.message,true)}}
async function refresh(){listing=await api("/api/posts");renderList()}
async function login(){try{await api("/api/me");$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await refresh();clear()}catch(e){$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");$("login-notice").textContent=new URLSearchParams(location.search).get("password")==="changed"?"密码已修改，请使用新密码登录。":e.message}}
$("login-form").onsubmit=async e=>{e.preventDefault();$("login-submit").disabled=true;$("login-notice").textContent="正在登录…";try{await api("/api/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});$("password").value="";location.replace("/admin/")}catch(error){$("password").value="";$("login-notice").textContent=error.message}finally{$("login-submit").disabled=false}};
$("password-toggle").onclick=()=>{const visible=$("password-panel").classList.toggle("hidden")===false;$("password-toggle").setAttribute("aria-expanded",String(visible));$("password-form").reset();$("password-notice").textContent="";if(visible)$("current-password").focus()};
$("password-form").onsubmit=async e=>{
 e.preventDefault();
 if(dirty){$("password-notice").textContent="请先保存文章或放弃未保存的修改，再修改密码。";return}
 const currentPassword=$("current-password").value,newPassword=$("new-password").value,confirmPassword=$("confirm-password").value;
 if(newPassword!==confirmPassword){$("password-notice").textContent="两次新密码不一致。";return}
 $("password-submit").disabled=true;$("password-notice").textContent="正在修改…";
 try{await api("/api/password",{method:"POST",body:JSON.stringify({currentPassword,newPassword,confirmPassword})});$("password-form").reset();location.replace("/admin/login/?password=changed")}
 catch(error){$("password-form").reset();$("password-notice").textContent=error.message}
 finally{$("password-submit").disabled=false}
};
if(new URLSearchParams(location.search).get("password")==="changed")$("login-notice").textContent="密码已修改，请使用新密码登录。";
function insert(before,after="",fallback="文字"){const el=fields.body,start=el.selectionStart,end=el.selectionEnd,selected=el.value.slice(start,end)||fallback;el.setRangeText(before+selected+after,start,end,"end");el.focus();el.dispatchEvent(new Event("input"))}
document.querySelectorAll("[data-insert]").forEach(button=>button.onclick=()=>{const kind=button.dataset.insert;if(kind==="heading")insert("\n## ","\n","小标题");if(kind==="bold")insert("**","**","重点");if(kind==="link")insert("[","](https://example.com/)","链接文字");if(kind==="list")insert("\n- ","","列表项目");if(kind==="quote")insert("\n> ","","引用内容");if(kind==="code")insert("\n```\n","\n```\n","代码")});
for(const field of Object.values(fields))field.addEventListener("input",()=>{dirty=true;preview()});
$("new").onclick=()=>{if(discard())clear()};
$("save").onclick=async()=>{const data=Object.fromEntries(ids.map(id=>[id,fields[id].value]));if(!data.title.trim()||!data.category.trim()||!data.summary.trim()||!data.body.trim()){message("标题、分类、摘要和正文都要填写。",true);return}if(!current&&!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.slug)){message("网址短名只允许小写英文、数字和连字符。",true);return}if(current){data.id=current.id;data.version=current.version}message("正在发布…");$("save").disabled=true;try{const result=await api("/api/post",{method:"PUT",body:JSON.stringify(data)});dirty=false;await refresh();await openPost(result.id);message("文章已发布，前台刷新后即可看到。")}catch(e){message(e.message,true)}finally{$("save").disabled=false}};
$("delete").onclick=async()=>{if(!current)return;const title=fields.title.value;if(!confirm('确定删除“'+title+'”？这会从前台撤下文章。'))return;message("正在删除…");try{await api("/api/post",{method:"DELETE",body:JSON.stringify(current)});await refresh();clear();message("文章已删除。")}catch(e){message(e.message,true)}};
$("image").onclick=()=>$("image-file").click();$("image-file").onchange=async()=>{const file=$("image-file").files[0];if(!file)return;if(!["image/png","image/jpeg","image/webp","image/gif"].includes(file.type)||file.size>5*1024*1024){message("请选择 5 MB 以内的 PNG、JPG、WebP 或 GIF。",true);return}message("正在上传图片…");try{const bytes=new Uint8Array(await file.arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const result=await api("/api/image",{method:"POST",body:JSON.stringify({type:file.type,base64:btoa(binary),alt:file.name})});insert("\n"+result.markdown+"\n","","");message("图片已上传，并插入正文。")}catch(e){message(e.message,true)}finally{$("image-file").value=""}};
$("logout").onclick=async()=>{if(!discard())return;try{await api("/api/logout",{method:"POST"});dirty=false;location.replace("/admin/login/")}catch(e){message(e.message,true)}};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
login().catch(e=>message(e.message,true));
})();
</script></body></html>
